<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>Onboarding UX Preview</title><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;800&family=Instrument+Serif:ital@0;1&display=swap');:root{--ink:#1a1a2e;--paper:#f4f1ea;--marker:#c8a96e;--rule:#ddd8cf;--text:#2c2c3a;--muted:#6e6e7e;}*{box-sizing:border-box;font-family:"Noto Naskh Arabic","Instrument Serif",system-ui,sans-serif;}body{background:#ece9de;color:var(--ink);margin:0;padding:24px;line-height:1.55;} .container{max-width:720px;margin:0 auto;background:var(--paper);border:1.5px solid var(--rule);border-radius:20px;padding:32px;box-shadow:0 12px 40px rgba(26,26,46,.06);}h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:2rem;margin:0 0 4px;} .subtitle{color:var(--muted);margin-bottom:28px;font-size:.95rem;} .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px;} .card{border:1.5px solid var(--rule);border-radius:14px;padding:18px 16px;background:#fff;cursor:pointer;transition:.12s;} .card:hover{border-color:var(--ink);transform:translateY(-2px);} .card.selected{border-color:var(--marker);background:#fcf9f0;} .btn{display:inline-block;padding:12px 24px;border-radius:10px;background:var(--ink);color:#fff;border:0;font-family:inherit;font-weight:600;cursor:pointer;} @media(max-width:600px){.cards{grid-template-columns:1fr;}.container{padding:20px;}}</style></head><body><div class="container" role="main"><h1>👋 خلينا نجهز Magiclly ليك</h1><p class="subtitle">اختر هويتك التعليمية ونجهز تجربتك.</p><div class="cards" role="radiogroup"><button class="card selected" role="radio" aria-checked="true"><b>طالب</b><span>مرحلة + صف</span></button><button class="card" role="radio" aria-checked="false"><b>خريج</b><span>مباشرة</span></button><button class="card" role="radio" aria-checked="false"><b>Freelancer</b><span>بدون مرحلة</span></button></div><h2>إيه مرحلتك الدراسية؟</h2><div class="cards"><button class="card"><b>ابتدائي</b></button><button class="card selected"><b>إعدادي</b></button><button class="card"><b>ثانوي</b></button><button class="card"><b>بكالوريا</b></button></div><div style="margin-top:8px;"><button class="btn">ابدأ Magiclly</button></div><p style="font-size:.82rem;color:var(--muted);">RTL · mobile-first · taxonomy DB · لا hardcode للأسماء · progress 1/4 → 2/3/4</p></div></body></html>
